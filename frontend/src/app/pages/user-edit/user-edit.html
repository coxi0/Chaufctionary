<a routerLink="/utilisateurs">← Retour à la liste</a>

<h1>Modifier l'utilisateur</h1>

<form class="card" [formGroup]="form" (ngSubmit)="onSubmit()">
  <label>Nom</label>
  <input formControlName="nom" />

  <label>Prénom</label>
  <input formControlName="prenom" />

  <label>Email</label>
  <input type="email" formControlName="email" />

  <label>Rôle</label>
  <select formControlName="roleId">
    @for (r of rolesDisponibles(); track r.id) {
      <option [ngValue]="r.id">{{ r.libelle }}</option>
    }
  </select>

  <label class="checkbox">
    <input type="checkbox" formControlName="estActif" /> Compte actif
  </label>

  @if (erreur()) {
    <p class="erreur">{{ erreur() }}</p>
  }

  <button type="submit" [disabled]="form.invalid">Enregistrer</button>
</form>
