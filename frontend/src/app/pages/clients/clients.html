<h1>Clients</h1>

<div class="search">
  <input [(ngModel)]="recherche" (ngModelChange)="charger()" placeholder="Rechercher par nom ou ville..." />
  <button (click)="charger()">Rechercher</button>
  @if (peutCreer()) {
    <button routerLink="/clients/nouveau">+ Nouveau client</button>
  }
</div>

@if (clients().length === 0) {
  <p class="muted">Aucun client trouvé.</p>
} @else {
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>N° client</th>
          <th>Nom</th>
          <th>Ville</th>
          <th>Téléphone</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (c of clients(); track c.id) {
          <tr>
            <td class="num">{{ c.numero }}</td>
            <td>{{ c.nom }}</td>
            <td>{{ c.ville }}</td>
            <td>{{ c.telephone }}</td>
            <td><a [routerLink]="['/clients', c.id]">Ouvrir</a></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
